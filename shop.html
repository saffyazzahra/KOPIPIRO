<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kopipiro</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            background: #faf6f1;
            color: #3b2a1e;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #3b2a1e;
            color: #fff;
        }

        header a {
            color: #f3e3c7;
            margin-right: 12px;
        }

        #promo {
            margin: 0;
            padding: 8px 24px;
            background: #f3e3c7;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            padding: 24px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 1px 4px #0002;
        }

        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
        }

        .old {
            text-decoration: line-through;
            color: #999;
            margin-right: 6px;
        }

        aside {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            height: fit-content;
        }

        #cats button.on {
            font-weight: bold;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <h1>Kopipiro</h1>
        <div>
            <a href="dashboard.html">Staff dashboard</a>
            <span id="who"></span> <button id="btnAuth"></button>
        </div>
    </header>
    <p id="promo"></p>
    <main>
        <section>
            <div id="cats"></div>
            <div id="grid"></div>
        </section>
        <aside>
            <h2>Checkout</h2>
            <ul id="cart"></ul>
            <p>Total: <b id="total">Rp 0</b></p>
            <input id="guestName" placeholder="Your name (guests)">
            <button id="btnCheckout">Place order</button>
            <div id="result"></div>
        </aside>
    </main>
    <dialog id="dlg">
        <h3>Log in / Register</h3>
        <p><input id="aName" placeholder="Name (register only)"></p>
        <p><input id="aEmail" type="email" placeholder="Email"></p>
        <p><input id="aPass" type="password" placeholder="Password"></p>
        <button id="btnLogin">Log in</button>
        <button id="btnReg">Register</button>
        <button id="btnCancel">Cancel</button>
        <p id="aMsg"></p>
    </dialog>
    <script>
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
        let me = { role: 'guest' }, category = '', cart = {}, known = {};
        async function api(url, opts = {}) {
            const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Request failed');
            return data;
        }
        async function init() {
            me = await api('api/auth.php?action=me');
            $('#who').textContent = me.name ? me.name + ' (' + me.role + ')' : 'Guest';
            $('#btnAuth').textContent = me.name ? 'Log out' : 'Log in';
            $('#promo').textContent = me.role === 'customer'
                ? 'Member discount active: 10% off every item!'
                : 'Register and log in as a customer to get 10% off.';
            await loadProducts();
        }
        async function loadProducts() {
            const q = category ? '?category=' + encodeURIComponent(category) : '';
            const data = await api('api/products.php' + q);
            data.products.forEach(p => known[p.id] = p); // remember prices for the cart
            $('#cats').innerHTML = ['', ...data.categories.map(c => c.name)].map(c =>
                `<button class="${c === category ? 'on' : ''}" data-c="${esc(c)}">${esc(c || 'All')}</button>`
            ).join(' ');
            $('#grid').innerHTML = data.products.map(p => `
 <div class="card">
 <img src="${esc(p.image || '')}" alt="">
 <h3>${esc(p.name)}</h3>
 <small>${esc(p.category)} | rating ${p.rating ?? '-'} (${p.reviews})</small>
 <p>${esc((p.description || '').slice(0, 100))}</p>
 <p>${p.final_price < p.price ? `<span class="old">${rp(p.price)}</span>` : ''}
 <b>${rp(p.final_price)}</b></p>
 <button data-add="${p.id}">Add</button>
 </div>`).join('');
            renderCart();
        }
        function renderCart() {
            let total = 0;
            $('#cart').innerHTML = Object.entries(cart).map(([id, qty]) => {
                const p = known[id];
                const line = p.final_price * qty;
                total += line;
                return `<li>${qty} x ${esc(p.name)} @ ${rp(p.final_price)} = ${rp(line)}
 <button data-rm="${id}">x</button></li>`;
            }).join('');
            $('#total').textContent = rp(total);
        }
        document.addEventListener('click', async e => {
            const d = e.target.dataset;
            if (d.c !== undefined) { category = d.c; loadProducts(); }
            if (d.add) { cart[d.add] = (cart[d.add] || 0) + 1; renderCart(); }
            if (d.rm) { delete cart[d.rm]; renderCart(); }
            if (e.target.id === 'btnPay') {
                try {
                    const r = await api('api/pay.php', {
                        method: 'POST',
                        body: JSON.stringify({ order_code: d.code })
                    });
                    location.href = r.redirect_url; // Midtrans hosted payment page
                } catch (err) { $('#result').textContent = err.message; }
            }
        });
        $('#btnCheckout').onclick = async () => {
            const items = Object.entries(cart).map(([id, qty]) => ({ product_id: +id, qty }));
            try {
                const o = await api('api/orders.php', {
                    method: 'POST',
                    body: JSON.stringify({ items, customer_name: $('#guestName').value })
                });
                cart = {}; renderCart();
                $('#result').innerHTML = `Order <b>${esc(o.order_code)}</b><br>
 Subtotal ${rp(o.subtotal)}<br>Discount ${rp(o.discount)}<br>
 Total <b>${rp(o.total)}</b><br>
 <button id="btnPay" data-code="${esc(o.order_code)}">Pay online (sandbox)</button>`;
            } catch (err) { $('#result').textContent = err.message; }
        };
        async function auth(action) {
            try {
                const r = await api('api/auth.php?action=' + action, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: $('#aName').value, email: $('#aEmail').value,
                        password: $('#aPass').value
                    })
                });
                if (action === 'login') { $('#dlg').close(); cart = {}; init(); }
                else $('#aMsg').textContent = r.message;
            } catch (err) { $('#aMsg').textContent = err.message; }
        }
        $('#btnLogin').onclick = () => auth('login');
        $('#btnReg').onclick = () => auth('register');
        $('#btnCancel').onclick = () => $('#dlg').close();
        $('#btnAuth').onclick = async () => {
            if (me.name) {
                await api('api/auth.php?action=logout', { method: 'POST' });
                cart = {}; known = {}; init();
            } else $('#dlg').showModal();
        };
        init();
    </script>
</body>

</html>
