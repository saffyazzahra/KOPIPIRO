<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Kopipiro Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 24px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        td,
        th {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: left;
        }

        .charts {
            display: flex;
            gap: 24px;
        }

        .charts div {
            width: 45%;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Kopipiro Dashboard</h1>
    <p><span id="who"></span> <a href="shop.html">Back to shop</a></p>
    <form id="loginForm" class="hidden">
        <input id="email" type="email" placeholder="Email">
        <input id="pass" type="password" placeholder="Password">
        <button>Log in</button> <span id="loginMsg"></span>
    </form>
    <section id="ordersBox" class="hidden">
        <h2 id="ordersTitle"></h2>
        <table>
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Cashier</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </section>
    <section id="ownerBox" class="hidden">
        <h2>Sales</h2>
        <p><a href="api/export.php">Download all orders (Excel)</a></p>
        <div class="charts">
            <div><canvas id="c1"></canvas></div>
            <div><canvas id="c2"></canvas></div>
        </div>
        <h2>Add product</h2>
        <form id="prodForm">
            <input name="name" placeholder="Product name" required>
            <select name="category_id" id="catSel"></select>
            <input name="price" type="number" min="1" placeholder="Price (Rp)" required>
            <input name="description" placeholder="Description">
            <input name="image" type="file" accept="image/jpeg,image/png,image/webp">
            <button>Add</button> <span id="pMsg"></span>
        </form>
    </section>
    <script>
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
        let me = {};
        async function api(url, opts = {}) {
            const isForm = opts.body instanceof FormData; // let the browser set multipart headers
            const headers = isForm ? {} : { 'Content-Type': 'application/json' };
            const res = await fetch(url, { headers, ...opts });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Request failed');
            return data;
        }
        async function init() {
            me = await api('api/auth.php?action=me');
            const staff = ['owner', 'cashier'].includes(me.role);
            $('#who').textContent = me.name ? me.name + ' (' + me.role + ')' : 'Not logged in';
            $('#loginForm').classList.toggle('hidden', staff);
            $('#ordersBox').classList.toggle('hidden', !staff);
            $('#ownerBox').classList.toggle('hidden', me.role !== 'owner');
            if (!staff) return;
            loadOrders();
            if (me.role === 'owner') { loadCharts(); loadCategories(); }
        }
        async function loadOrders() {
            const rows = await api('api/orders.php');
            $('#ordersTitle').textContent = me.role === 'owner' ? 'All orders' : 'My assigned orders';
            $('#rows').innerHTML = rows.map(o => `<tr>
 <td>${esc(o.order_code)}</td><td>${esc(o.created_at)}</td><td>${esc(o.customer_name)}</td>
 <td>${esc(o.items)}</td><td>${rp(o.total)}</td><td>${esc(o.cashier ?? '-')}</td>
 <td><select data-id="${o.id}">${['pending', 'paid', 'done'].map(s =>
                `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
 </tr>`).join('');
        }
        $('#rows').addEventListener('change', async e => {
            await api('api/orders.php?id=' + e.target.dataset.id,
                { method: 'PUT', body: JSON.stringify({ status: e.target.value }) });
        });
        async function loadCharts() {
            const s = await api('api/sales.php');
            new Chart($('#c1'), {
                type: 'bar', data: {
                    labels: s.daily.map(r => r.day),
                    datasets: [{ label: 'Revenue (Rp)', data: s.daily.map(r => +r.revenue) }]
                }
            });
            new Chart($('#c2'), {
                type: 'pie', data: {
                    labels: s.top.map(r => r.product_name),
                    datasets: [{ data: s.top.map(r => +r.qty) }]
                }
            });
        }
        async function loadCategories() {
            const d = await api('api/products.php');
            $('#catSel').innerHTML = d.categories.map(c =>
                `<option value="${c.id}">${esc(c.name)}</option>`).join('');
        }
        $('#prodForm').onsubmit = async e => {
            e.preventDefault();
            try {
                await api('api/products.php', { method: 'POST', body: new FormData(e.target) });
                $('#pMsg').textContent = 'Product added';
                e.target.reset();
            } catch (err) { $('#pMsg').textContent = err.message; }
        };
        $('#loginForm').onsubmit = async e => {
            e.preventDefault();
            try {
                await api('api/auth.php?action=login', {
                    method: 'POST',
                    body: JSON.stringify({ email: $('#email').value, password: $('#pass').value })
                });
                init();
            } catch (err) { $('#loginMsg').textContent = err.message; }
        };
        init();
    </script>
</body>

</html>
